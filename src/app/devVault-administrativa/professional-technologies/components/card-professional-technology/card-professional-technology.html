<div class="bg-card flex flex-col gap-1 rounded-lg p-5 min-h-full">
    <div class="flex justify-between text-secondary mb-5">
        <div 
            class="rounded-sm flex justify-center items-center w-10 h-10"
            [class.bg-secondary]="!professionalTechnology().logoURL"
        >
            @if (!professionalTechnology().logoURL) {
                <i class="fa-solid fa-terminal"></i>
            }@else {
                <img [src]="logoOptimizado()" [alt]="professionalTechnology().tecnologia">
            }
        </div>
        <div class="flex gap-4">            
            <button class="cursor-pointer">
                <i class="fa-solid fa-pen"></i>
            </button>
            <button (click)="emitirUUIDProfessionalTechnology()" class="cursor-pointer">
                <i class="fa-solid fa-trash text-[#FFB4AB]"></i>
            </button>    
        </div>
    </div>
    <div 
        class="px-2 py-1 rounded-sm max-w-fit"
        [ngClass]="obtenerColorTech(professionalTechnology().tipoTecnologia)"
    >
        <span class="uppercase text-[12px] font-bold"> {{ professionalTechnology().tipoTecnologia }} </span>
    </div>
    <h3 class="text-primary text-xl font-bold">{{ professionalTechnology().tecnologia }}</h3>
    @if (professionalTechnology().nivel) {
        <div class="flex gap-2 text-secondary items-center">
            <span 
                class="w-3 h-3 block rounded-full"
                [class.bg-yellow-500]="professionalTechnology().nivel === 'Intermedio'"
                [class.bg-red-600]="professionalTechnology().nivel === 'Básico'"
                [class.bg-green-600]="professionalTechnology().nivel === 'Avanzado'"
            ></span>
            <span> {{ professionalTechnology().nivel }} </span>
        </div>
    }
</div>
