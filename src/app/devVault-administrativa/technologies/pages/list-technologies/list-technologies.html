<div class="max-w-350 m-auto">
    <main class="py-5 md:px-10 px-5">
        <page-header firstTitle="Inventario de" secondTitle="Tecnología" description="Gestiona tu ecosistema tecnológico: lenguajes, frontend, backend, DevOps y más." />

        <div class="w-full flex flex-col gap-3">
            <div class="flex justify-between w-full gap-10">
                <div class="w-full bg-secondary rounded-lg py-3 px-3 text-primary flex items-center gap-2">
                    <i class="fas fa-search"></i>
                    <input
                        class="bg-secondary w-full appearance-none focus-within:outline-none"
                        type="text"
                        placeholder="Buscar por nombre"
                    >
                </div>
                <a routerLink="/experience/new-technology" class="min-w-fit px-4 py-3 bg-[#C0C1FF]/10 rounded-sm text-[#C0C1FF]">
                    <i class="fa-solid fa-plus"></i>
                    Nueva Tecnología
                </a>
            </div>

            <div class="grid grid-cols-4 gap-3">
                @for (tech of resourceTechnologies.value()?.data; track $index) {
                    <div class="bg-card flex flex-col gap-1 rounded-lg p-5">
                        <div class="flex justify-between text-secondary mb-5">
                            <div 
                                class="rounded-sm flex justify-center items-center w-10 h-10"
                                [class.bg-secondary]="!tech.logo_url"
                            >
                                @if (!tech.logo_url) {
                                    <i class="fa-solid fa-terminal"></i>
                                }@else {
                                    <img [src]="tech.logo_url" [alt]="tech.tecnologia">
                                }
                            </div>
                            <div class="flex items-start">
                                <button class="cursor-pointer">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div 
                            class="px-2 py-1 rounded-sm max-w-fit"
                            [ngClass]="obtenerColorTech(tech.tipo_tecnologia)"
                        >
                            <span class="uppercase text-[12px] font-bold"> {{ tech.tipo_tecnologia }} </span>
                        </div>
                        <h3 class="text-primary text-xl font-bold">{{ tech.tecnologia }}</h3>
                        @if (tech.nivel) {
                            <div class="flex gap-2 text-secondary items-center">
                                <span 
                                    class="w-3 h-3 block rounded-full"
                                    [class.bg-yellow-500]="tech.nivel === 'Intermedio'"
                                    [class.bg-red-600]="tech.nivel === 'Básico'"
                                    [class.bg-green-600]="tech.nivel === 'Avanzado'"
                                ></span>
                                <span> {{ tech.nivel }} </span>
                            </div>
                        }
                    </div>
                }
            </div>
        </div>
    </main>
</div>

@if (resourceTechnologies.isLoading()) {
    <loading-overlay/>
}
