<div class="flex flex-col w-full gap-1">
    <label class="uppercase text-secondary font-semibold text-[12px] font-secondary">
        {{ label() }} {{ required() ? '(*)' : '' }}        
    </label>
    <input 
        class="bg-primary rounded-lg py-2 px-3 appearance-none text-primary focus-within:outline-none" 
        [type]="type()"
        [placeholder]="placeholder()"
        [formControl]="$any(control())"
    >
</div>
