<div class="max-w-350 m-auto">
    <main class="py-5 md:px-10 px-5">
        <page-header firstTitle="Inventario de" secondTitle="Experiencias" description="Gestiona tu trayectoria profesiona y vincula tus logros a proyectos específicos." />

        <div class="w-full flex flex-col gap-3">
            <div class="flex flex-col-reverse md:flex-row justify-between w-full gap-2 md:gap-10">
                <div class="w-full bg-secondary rounded-lg py-3 px-3 text-primary flex items-center gap-2">
                    <i class="fas fa-search"></i>
                    <input
                        class="bg-secondary w-full appearance-none focus-within:outline-none"
                        type="text"
                        placeholder="Buscar por empresa (mínimo 2 caracteres)"
                        (input)="nameCompany.set($event.target.value)"
                    >
                    @if (isLoading() && nameCompany()) {
                        <loader-input/>
                    }
                </div>
                <a routerLink="new-experience" class="min-w-fit px-4 py-3 bg-[#C0C1FF]/10 rounded-sm text-[#C0C1FF]">
                    <i class="fa-solid fa-plus"></i>
                    Nueva Experiencia
                </a>
            </div>

            @if (experiences().length > 0) {
                <div class="grid grid-cols-1 w-full gap-3">
                    @for (exp of experiences(); track $index) {
                        <card-experience-detail (eliminar)="eliminarExperiencia($event)" [experience]="exp"/>
                    }
                </div>
            }@else{
                <div class="w-full py-10 flex justify-center items-center">
                    <p class="text-white">No se encontraron experiencias.</p>
                </div>
            }            
        </div>
    </main>
</div>

@if (isLoading() && nameCompany()===null) {
    <loading-overlay/>
}

@if (isLoadingDelated()) {
    <loading />
}
