<div class="max-w-350 m-auto">
     <main class="py-5 md:px-10 px-5">
        <span class="font-medium text-secondary block mb-4">Datos profesionales > <span class="text-primary"> Editar</span></span>
        <form [formGroup]="formProfessionalData" (ngSubmit)="editarDatos()">
            <div class="grid md:grid-cols-[1fr_auto] gap-3">
                <div class="flex flex-col gap-3">                    
                    <section-card-component [titleHeader]="'Datos básicos'" [iconHeader]="'fa-regular fa-user'">
                        <div class="flex flex-col gap-5">
                            <div class="flex flex-col md:flex-row w-full gap-7">
                                <div class="w-full">
                                    <form-input-field 
                                        label="Nombres" 
                                        placeholder="Ej. Sarhen"
                                        type="text" 
                                        [required]="true"
                                        [control]="formProfessionalData.get('nombres')!"
                                    />
                                </div>
                                <div class="w-full">
                                    <form-input-field 
                                        label="Apellidos" 
                                        placeholder="Ej. Ramírez"
                                        type="text"
                                        [required]="true"
                                        [control]="formProfessionalData.get('apellidos')!"
                                    />
                                </div>
                            </div>
                            
                            <form-input-field 
                                    label="Puesto"
                                    placeholder="Ej. Desarrollador Fullstack"
                                    type="text"
                                    [control]="formProfessionalData.get('puesto')!"
                                />

                            <form-text-area-field
                                label="Biografía"
                                placeholder="Escribe una breve descripción que resuma tu perfil profesional"
                                [control]="formProfessionalData.get('biografia')!"
                                maxLength="4000"
                                descriptionMaxLength="Máximo 4 000 caracteres."
                            />
                        </div>
                    </section-card-component>

                    <section-card-component titleHeader="Redes y Curriculum Vitae" iconHeader="fa-solid fa-link">
                        <div class="flex flex-col gap-5">
                            <div class="flex flex-col md:flex-row w-full gap-7">
                                <div class="w-full">
                                    <form-icon-input-field
                                        label="url linkedin"
                                        placeholder="https://linkedin.com/in/username"
                                        type="url"
                                        icon="fa-brands fa-linkedin"
                                        [control]="formProfessionalData.get('linkedin_url')!"
                                    />
                                </div>
                                <div class="w-full">
                                    <form-icon-input-field
                                        label="url github"
                                        placeholder="https://github.com/username"
                                        type="url"
                                        icon="fa-brands fa-github"
                                        [control]="formProfessionalData.get('github_url')!"
                                    />
                                </div>
                            </div>
    
                            <form-icon-input-field
                                label="curriculum vitae"
                                placeholder="https://mi-curriculum.org"
                                type="url"
                                icon="fa-solid fa-file"
                                [control]="formProfessionalData.get('cv_url')!"
                            />
                        </div>
                    </section-card-component>

                    <section-card-component titleHeader="Contacto" iconHeader="fa-regular fa-user">
                        <div class="flex flex-col gap-5">
                            <div class="flex flex-col md:flex-row w-full gap-7">
                                <div class="flex flex-col w-fit gap-1">
                                    <label class="uppercase text-secondary font-semibold text-[12px] font-secondary">prefijo</label>
                                    <select 
                                        class="bg-primary rounded-lg py-2 px-3 appearance-none text-primary focus-within:outline-none" 
                                        name="prefijo" 
                                        id="prefijo"
                                        formControlName="prefijo_telefono"
                                    >
                                        <option [ngValue]="null">Seleccionar</option>
                                        <option ngValue="51">+51(PE)</option>
                                        <option ngValue="57">+57(COL)</option>
                                        <option ngValue="591">+591(BO)</option>
                                        <option ngValue="56">+56(CL)</option>
                                        <option ngValue="54">+54(AR)</option>
                                        <option ngValue="593">+593(EC)</option>
                                        <option ngValue="503">+503(SV)</option>
                                        <option ngValue="34">+34(ES)</option>
                                        <option ngValue="502">+502(GT)</option>
                                        <option ngValue="504">+504(HN)</option>
                                        <option ngValue="52">+52(MX)</option>
                                        <option ngValue="505">+505(NI)</option>
                                        <option ngValue="507">+507(PA)</option>
                                        <option ngValue="595">+595(PY)</option>
                                        <option ngValue="598">+598(UY)</option>
                                        <option ngValue="58">+58(VE)</option>
                                    </select>
                                </div>
                                <div class="w-full">
                                    <form-input-field
                                        label="teléfono"
                                        placeholder="999 999 999"
                                        type="text"
                                        [control]="formProfessionalData.get('telefono')!"
                                    />
                                </div>
                            </div>

                            <form-input-field
                                label="correo de contacto"
                                placeholder="tom@dev.io"
                                type="email"
                                [control]="formProfessionalData.get('correo_contacto')!"
                            />
                        </div>
                    </section-card-component>
                </div>
                <div class="flex flex-col gap-5">
                    <section-card-component titleHeader="logo" iconHeader="fa-solid fa-palette">
                        <logo-preview-component
                            [control]="formProfessionalData.get('logo_url')!"
                            [subTitle]="'Previsualización de logo'"
                            [placeHolder]="'https://storage.io/mi-logo.png'"
                            [iconNotFound]="'fa-solid fa-palette'"/>
                    </section-card-component>

                    <div class="flex flex-col gap-3">
                        <button type="submit" class="w-full cursor-pointer px-4 py-2 bg-[#C0C1FF]/10 rounded-sm text-[#C0C1FF]">                        
                            Guardar Cambios
                        </button>
                        <button type="button" routerLink="/professional-data" class="cursor-pointer w-full px-4 py-2 bg-transparent border-2 border-[#464554]/30 rounded-sm text-[#C0C1FF]">
                            Cancelar
                        </button>
                    </div>

                    <adsterra-banner />
                </div>
            </div>
        </form>
    </main>
</div>

@if (isLoading()) {
    <loading />
}
