<div class="flex min-h-svh">
    <div class="lg:flex-2 overflow-hidden lg:block hidden bg-card">
         <div class="relative w-full h-full flex items-center justify-center p-12">
             <div class="absolute w-[80%] aspect-auto rounded-xl overflow-hidden border border-outline-variant/30 transform -rotate-3 -translate-x-12 -translate-y-25 z-10 scale-95 opacity-80">
                <img class="object-contain w-full h-full" src="portada_2.webp" alt="imagen portada devVault">
            </div>
            <div class="absolute w-[80%] aspect-auto rounded-xl overflow-hidden border border-outline-variant/30 shadow-2xl transform rotate-3 translate-x-12 translate-y-20 z-20">
                <img class="object-contain w-full h-full" src="portada_1.webp" alt="imagen portada devVault">
            </div>
         </div>
    </div>
    <div class="flex-1 flex justify-center items-center bg-card-secondary py-14.5 px-8 lg:px-16">
        <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
            <div class="max-w-lg flex flex-col gap-10">
                <div class="flex items-center gap-2">
                    <img class="w-6 h-6" src="logo_white.webp" alt="logo devVault">
                    <h1 class="text-primary text-lg">DevVault</h1>
                </div>
                @if (!isChangePassword()) {        
                <div class="flex flex-col gap-1">
                    <h2 class="text-primary text-4xl font-bold">Cambiar contraseña</h2>
                    <p class="text-secondary text-md">Ingresa tu nueva contraseña para cambiarla.</p>
                </div>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-[#908FA0] tracking-wider font-medium">Nueva contraseña</label>
                        <div class=" border-b bg-secondary border-[#464554] px-3 rounded-sm flex items-center gap-2">
                            <input formControlName="newPassword" class="text-sm outline-0 text-secondary bg-secondary w-full py-2" type="password" placeholder="Nueva contraseña">
                        </div>
                    </div>
                </div>
                <button type="submit" class="bg-[#C0C1FF]/20 text-primary font-medium text-[16px] py-3.5 rounded-sm cursor-pointer">Recuperar contraseña</button>
                }@else {
                    <div class="flex flex-col gap-1">
                    <h2 class="text-primary text-4xl font-bold">Contraseña cambiada</h2>
                    <p class="text-secondary text-md">Se ha cambiado tu contraseña exitosamente.</p>
                    <div class="flex justify-center">
                        <div class="w-20 h-20 flex justify-center items-center">
                            <i class="fa-solid fa-envelope-circle-check text-6xl text-secondary"></i>
                        </div>
                    </div>
                    <a routerLink="auth/login" class="text-purple text-center bg-secondary px-4 py-2 rounded-sm">Ir a iniciar sesión</a>
                </div>
                }
                <span class="text-[#908FA0] tracking-wider text-[13px] mt-10">© {{ currentYear }} DevVault. Creado por <a href="https://www.linkedin.com/in/miguelangelvegaperez" target="_blank" class="text-purple">MrDevv</a></span>
            </div>
        </form>

    </div>
    
</div>

@if (isLoading()) {
    <loading/>
}
